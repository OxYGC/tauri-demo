name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: false
        default: ''
# ⭐ 新增：授予 Release 写入权限,(Github须显式声明 write 才能创建/更新 Release)
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ⭐ macOS 拆为两个独立 job
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          # Linux / Windows 不变
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ⭐ 修改 1：先安装 pnpm（必须在 setup-node 之前）
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      # ⭐ 修改 2：再 setup-node（此时 pnpm 已存在，cache 才能正常工作）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # ⭐ 修改 3：只保留一次 pnpm install（删掉了之前重复的那个）
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Rust 环境
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux 系统依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Tauri v2 官方 Action
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.17  # ⭐ 锁定具体版本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}